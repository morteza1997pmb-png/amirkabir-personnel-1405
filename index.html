
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه اطلاعات پرسنلی هنرستان امیرکبیر</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(135deg,#dff3ff,#f4faff);
  color:#24445c;
  padding:25px 14px;
}
.container{
  max-width:760px;
  margin:auto;
  background:white;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 10px 35px #387ca522;
}
.header{
  text-align:center;
  padding:35px 20px;
  background:linear-gradient(135deg,#55b8ed,#1686ca);
  color:white;
}
.header .symbol{font-size:42px;margin-bottom:12px}
.header h1{font-size:25px;margin:8px 0}
.header p{font-size:14px;margin:10px 0 0}
.content{padding:28px}
.notice{
  background:#edf8ff;
  border-right:4px solid #299bd8;
  padding:14px;
  border-radius:9px;
  font-size:13px;
  line-height:2;
  margin-bottom:25px;
}
h2{font-size:18px;color:#1686ca;margin:0 0 22px}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.field{margin-bottom:4px}
label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:9px;
}
input,textarea{
  width:100%;
  padding:13px;
  border:1px solid #cce5f4;
  border-radius:9px;
  font-family:inherit;
  font-size:14px;
  outline:none;
  background:#fbfdff;
}
input:focus,textarea:focus{
  border-color:#299bd8;
  box-shadow:0 0 0 3px #299bd81a;
}
textarea{min-height:90px;resize:vertical}
.full{grid-column:1/-1}
.optional{font-size:11px;color:#1686ca;font-weight:normal}
button{
  width:100%;
  margin-top:25px;
  padding:16px;
  border:0;
  border-radius:11px;
  background:linear-gradient(135deg,#55b8ed,#1686ca);
  color:white;
  font-family:inherit;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.6;cursor:wait}
#message{
  display:none;
  text-align:center;
  padding:15px;
  margin-top:18px;
  border-radius:10px;
  line-height:2;
  font-size:14px;
}
.footer{
  text-align:center;
  padding:18px;
  background:#f1f9fe;
  color:#6992ad;
  font-size:12px;
}
@media(max-width:560px){
  .grid{grid-template-columns:1fr}
  .content{padding:21px}
  .header h1{font-size:21px}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="symbol">🏫</div>
    <h1>هنرستان امیرکبیر</h1>
    <p>سامانه گردآوری اطلاعات پرسنلی</p>
  </div>

  <div class="content">
    <div class="notice">
      همکار گرامی، لطفاً اطلاعات خود را با دقت در فرم زیر وارد کنید.
      شماره شبا در صورت دسترسی اختیاری است.
    </div>

    <h2>فرم اطلاعات کارکنان</h2>

    <form id="personnelForm">
      <div class="grid">
        <div class="field">
          <label>نام</label>
          <input name="name" required>
        </div>

        <div class="field">
          <label>نام خانوادگی</label>
          <input name="family" required>
        </div>

        <div class="field">
          <label>نام پدر</label>
          <input name="father" required>
        </div>

        <div class="field">
          <label>تاریخ تولد</label>
          <input name="birthDate" placeholder="مثلاً ۱۳۶۵/۰۵/۲۰" required>
        </div>

        <div class="field">
          <label>کد ملی</label>
          <input name="nationalId" inputmode="numeric" maxlength="10" required>
        </div>

        <div class="field">
          <label>کد پرسنلی</label>
          <input name="personnelCode" required>
        </div>

        <div class="field">
          <label>شماره حساب حقوق</label>
          <input name="account" inputmode="numeric" required>
        </div>

        <div class="field">
          <label>شماره شبا <span class="optional">(در صورت دسترسی)</span></label>
          <input name="sheba" placeholder="IR...">
        </div>

        <div class="field full">
          <label>آدرس محل سکونت</label>
          <textarea name="address" required></textarea>
        </div>

        <div class="field">
          <label>سنوات خدمت (سال)</label>
          <input name="serviceYears" type="number" min="0" step="0.5" required>
        </div>

        <div class="field">
          <label>شماره تماس منزل</label>
          <input name="homePhone" inputmode="tel" required>
        </div>

        <div class="field full">
          <label>شماره تماس موبایل</label>
          <input name="mobile" inputmode="tel" required>
        </div>
      </div>

      <button id="submitBtn" type="submit">ارسال اطلاعات</button>
      <div id="message"></div>
    </form>
  </div>

  <div class="footer">
    هنرستان امیرکبیر | سامانه اطلاعات پرسنلی
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwgNsVewQftGqbyWliXiNisIu5WGlQJX_IePzht1Qgmes7VYOk-1kvTk2H5EiGBFOa-/exec";

const form = document.getElementById("personnelForm");
const button = document.getElementById("submitBtn");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!form.reportValidity()) return;

  button.disabled = true;
  button.textContent = "در حال ارسال...";
  message.style.display = "none";

  try {
    const data = new URLSearchParams(new FormData(form));

    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      body: data
    });

    message.style.display = "block";
    message.style.background = "#e7f8ee";
    message.style.color = "#187747";
    message.textContent =
      "درخواست ارسال شد. برای اطمینان از ثبت اطلاعات، مسئول سامانه باید شیت را بررسی کند.";

    form.reset();
  } catch (error) {
    message.style.display = "block";
    message.style.background = "#fff0f0";
    message.style.color = "#a52b2b";
    message.textContent = "ارسال انجام نشد. لطفاً دوباره تلاش کنید.";
  }

  button.disabled = false;
  button.textContent = "ارسال اطلاعات";
});
</script>
</body>
</html>
